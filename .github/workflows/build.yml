name: Test and package NJU-Connect

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Test JavaScript Mixins
        shell: pwsh
        run: |
          node tests/cfw_mixin.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Template Mixin test failed' }
          node tests/cfw_mixin_file.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'File Mixin test failed' }
      - name: Test Go and build locked NJU binary
        shell: pwsh
        run: ./Build-NJU.ps1 -Test -OutputPath work/release-build/nju-connect.exe -Version v0.1.0-nju.1
      - name: Package clean source and Windows archives
        run: python scripts/package_release.py --version v0.1.0-nju.1 --binary work/release-build/nju-connect.exe
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: NJU-Connect-windows-and-source
          path: |
            releases/*.zip
            releases/SHA256SUMS.txt
          if-no-files-found: error
